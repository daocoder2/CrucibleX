[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cruciblex"
version = "0.1.0"
description = "Ray-based operator testing and case generation toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "ray[client]==2.58.0",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "openpyxl>=3.1",
]

[project.scripts]
cx = "cruciblex.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cruciblex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "gpu: GPU backend and CUDA contract tests",
  "ray: Ray scheduler and cluster integration tests",
  "npu: NPU backend contract or hardware tests",
  "hardware: tests requiring physical accelerator hardware",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
