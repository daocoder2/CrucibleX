operator:
  name: torch.example
  api: torch.example
  api_type: function
  supported_backends: [cpu]
parameters:
  - name: input
    kind: tensor
    dtype_families: [fp32]
    shape_rules:
      rank: [1]
      dims: [4]
    value_range:
      valid: [[-1, 1]]
      invalid: []
relationships: []
oracle:
  comparison: allclose
  tolerance:
    atol: 1.0e-6
    rtol: 1.0e-6
invalid_policy:
  expected_error: null
fuzz:
  count: 3
  seed: 17
  constraints: [random_coverage]
  invalid_count: 0
  max_elements: 16
  max_bytes: 64
  random_dtypes: [fp32, fp16]
  random_shapes: [[1, 4], [2, 2]]
  random_values: [[0, 1], [2, 3]]
  notes: "Use fuzz metadata to control coverage intent from the operator facts file."
