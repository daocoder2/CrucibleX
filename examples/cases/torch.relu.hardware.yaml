# Torch relu hardware sample for CPU, GPU, and NPU execution.
cases:
  - id: 201
    operator: {name: torch.relu}
    invocation: {api: torch.relu, api_type: function, executor: torch}
    oracle:
      comparison: allclose
      reference_executor: torch
      tolerance: {atol: 1.0e-6, rtol: 1.0e-6}
    generator: default
    generation: {count: 2, seed: 201}
    metadata:
      tags: [hardware, unary, torch]
      benchmark_policy: {warmup: 10, repeat: 20, min_time_ms: 100, throughput_items_per_call: 8}
    parameters:
      - name: input
        kind: tensor
        dtypes: [fp32]
        shape: {dims: [2, 4]}
        value_range: {valid: [[-2, 2]]}
