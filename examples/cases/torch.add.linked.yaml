          dims: [2, 2]
        value_range:
          valid: [[-1, 1]]
      - name: rhs
        kind: tensor
        dtypes: [fp32]
        shape:
          dims: [4, 4]
        value_range:
          valid: [[-1, 1]]
        metadata:
          same_dtype_as: lhs
          same_shape_as: lhs
