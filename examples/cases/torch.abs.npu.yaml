# Minimal torch_npu smoke case. The explicit torch executor is required.
cases:
  - id: 100
    operator:
      name: torch.abs
      version: null
      backward: false
    invocation:
      api: torch.abs
      api_type: function
      executor: torch
      metadata:
        benchmark:
          warmup: 5
          repeat: 20
          throughput_items_per_call: 16
        profiler:
          tool: msprof
          status: requested
    oracle:
      comparison: allclose
      reference_executor: torch
      tolerance:
        atol: 1.0e-6
        rtol: 1.0e-6
    generator: default
    parameters:
      - name: input
        kind: tensor
        dtypes: [fp32]
        shape:
          dim_count: [2]
          dim_values: [4]
        value_range:
          valid: [[-1, 1]]
